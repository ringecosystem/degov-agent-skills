name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --ignore-unknown --ignore-path .prettierignore --ignore-path .gitignore --check .

      - name: Check Python validation scripts
        run: |
          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/validate-dao-governance-security.py

      - name: Check x402 offer compatibility fixture
        run: python3 .github/scripts/test_x402_compat.py

      - name: Run dao-governance-research smoke test
        run: python3 .github/scripts/smoke-test-dao-governance-research.py --offline
