name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: skills/dao-governance-research/scripts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir skills/dao-governance-research/scripts install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check Python validation scripts
        run: |
          python3 -m py_compile scripts/tests/*.py
          pnpm run validate:dao-governance-security

      - name: Check TypeScript compilation, tests, and CLI startup
        run: pnpm --dir skills/dao-governance-research/scripts run check

      - name: Run dao-governance-research smoke test
        run: pnpm run smoke:dao-governance-research
