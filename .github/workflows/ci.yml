name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (prettier only)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check Python validation scripts
        run: |
          python3 -m py_compile scripts/tests/*.py
          pnpm run validate:dao-governance-security

      - name: Check x402 offer compatibility fixture
        run: pnpm run test:x402-compat

      - name: Run dao-governance-research smoke test
        run: pnpm run smoke:dao-governance-research
